site_name: LITAI LLC
site_description: LITAI LLC — Document AI, RAG evaluation, and production-grade extraction systems for investment firms, legal ops, and enterprise platforms.
site_url: https://litai-solutions.com

nav:
  - Home:
    - About: index.md
  - Services: services.md
  - Method:
    - How I think about search: method/index.md
    - In regulated search, the answer is the wrong output: method/regulated-search-answer-is-the-wrong-output.md
    - The judge does not score. The judge diagnoses.: method/judge-diagnoses-not-scores.md
    - Entity types are a competing set: method/entity-types-are-a-competing-set.md
  - Case Studies:
    - Overview: case-studies/index.md
    - Projects:
      - case-studies/investment-data-extraction.md
      - case-studies/rag-evaluation-infrastructure.md
      - case-studies/medical-document-intelligence.md
    - Hobby Projects:
      - case-studies/trivi.md
  - Blog:
    - blog/index.md

theme:
  name: material
  custom_dir: overrides
  features:
    - search.suggest
    - toc.integrate
    - navigation.tabs
    - navigation.tabs.sticky
    # - navigation.expand  # disabled: caused mobile menu to auto-open Home submenu
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: custom
      accent: custom  
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: custom
      accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/Logo-Icon-1.png
  favicon: assets/Logo-Icon-1.png

extra:
  generator: true
  social:
 #   - icon: fontawesome/solid/building
 #     link: https://company.com
    - icon: fontawesome/brands/github
      link: https://github.com/litai-solutions
 #   - icon: fontawesome/brands/youtube
 #     link: https://youtube.com/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/halyna-galanzina/
  analytics:
    # provider: google
    # property: G-W9Y130NXVZ

extra_css:
  - stylesheets/extra.css
  - stylesheets/hero.css
# AI Shop Assistant is disabled, not deleted. It was a 2-hour concept demo and
# sat oddly next to multi-month client work. The file stays in the repo; remove
# the line below to bring it back.
exclude_docs: |
  case-studies/ai-shop-assistant.md

plugins:
  - search
  # - social:
  #     cards_layout_options:
  #       background_color: "#111111"
  - blog:
      blog_dir: blog
      authors_file: "{blog}/.authors.yml"
      categories: true
  # Old /portfolio/ URLs. Only project-3 and project-5 were ever indexed by
  # Google, but redirecting all of them costs nothing and covers links shared
  # by hand. Remove once GSC shows no impressions on the old paths.
  - redirects:
      redirect_maps:
        portfolio/index.md: case-studies/index.md
        portfolio/projects/project-1.md: case-studies/investment-data-extraction.md
        portfolio/projects/project-2.md: case-studies/rag-evaluation-infrastructure.md
        portfolio/projects/project-3.md: case-studies/medical-document-intelligence.md
        portfolio/projects/project-4.md: case-studies/index.md
        portfolio/projects/project-5.md: case-studies/trivi.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.keys

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js

copyright: |
